<!DOCTYPE html>
<html lang="ko">
<head>

    // =================================================================
    // ★ 여기에 기존 코드의 const INITIAL_BASIC_SETTINGS = { ... } 부터
    //   function App() { ... } 끝까지 붙여넣으세요!
    // =================================================================

    // 2. 화면에 렌더링하기
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);

</html>
